name: "Deploy to GitHub Pages"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if needed)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build (if applicable)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || true
          fi
          if [ -d public ]; then
            echo "SITE_DIR=public" >> $GITHUB_ENV
          elif [ -d build ]; then
            echo "SITE_DIR=build" >> $GITHUB_ENV
          else
            mkdir -p public
            echo "SITE_DIR=public" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
