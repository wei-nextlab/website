name: "Deploy to GitHub Pages (manual git deploy)"

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (if needed)
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build (if applicable)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || true
          fi
          if [ -d public ]; then
            echo "SITE_DIR=public" >> $GITHUB_ENV
          elif [ -d build ]; then
            echo "SITE_DIR=build" >> $GITHUB_ENV
          else
            mkdir -p public
            echo "SITE_DIR=public" >> $GITHUB_ENV
          fi

      - name: Deploy to gh-pages (git push)
        env:
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          BRANCH: gh-pages
        run: |
          set -eux
          git --version
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          TMP_DIR=$(mktemp -d)
          echo "Cloning repo into $TMP_DIR"
          git clone "$REPO" "$TMP_DIR" || true
          cd "$TMP_DIR"
          # If branch doesn't exist, create orphan
          if git show-ref --verify --quiet refs/heads/$BRANCH; then
            git checkout $BRANCH
          else
            git checkout --orphan $BRANCH
          fi
          # Clean directory
          git rm -rf . || true
          # Copy site files from workspace
          SRC_DIR="$GITHUB_WORKSPACE/${{ env.SITE_DIR }}"
          echo "Copying from $SRC_DIR to $TMP_DIR"
          ls -la "$SRC_DIR" || true
          cp -a "$SRC_DIR/." . || true
          # Ensure there's something to commit
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to deploy"
          else
            git commit -m "Deploy Pages: $GITHUB_SHA"
            git push --force "$REPO" HEAD:$BRANCH
          fi

